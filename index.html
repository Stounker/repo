<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a1214">
  <title>VitaNeuro Calibration</title>
  <style>
    :root, html[data-theme="dark"] {
      --bg: #0a1214;
      --card: rgba(19, 48, 48, 0.72);
      --card-solid: #0f2424;
      --text: #f5efe8;
      --muted: rgba(245, 239, 232, 0.55);
      --line: rgba(45, 212, 191, 0.14);
      --line-strong: rgba(45, 212, 191, 0.28);
      --accent: #2dd4bf;
      --warm: #fbbf7a;
      --danger: #f87171;
      --shadow: 0 4px 6px rgba(0,0,0,0.12), 0 12px 28px rgba(0,0,0,0.28), 0 0 0 1px rgba(45, 212, 191, 0.06);
      --radius: 22px;
      --radius-sm: 14px;
      --glass-blur: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg); overflow-x: hidden;
    }
    .screen {
      display: none; min-height: 100vh; min-height: 100dvh;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Video Screen */
    #screen-video { padding: 0; background: #000; }
    #introVideo { width: 100%; height: 100vh; height: 100dvh; object-fit: cover; }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 24px; width: 100%; max-width: 480px;
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(155deg, rgba(255,255,255,0.08) 0%, transparent 42%);
      pointer-events: none;
    }
    .card > * { position: relative; z-index: 2; }

    h1, h2 { margin: 0 0 16px; line-height: 1.2; font-weight: 700; }
    h1 { font-size: clamp(22px, 5vw, 28px); color: var(--accent); }
    h2 { font-size: clamp(18px, 4vw, 22px); }
    p { margin: 0 0 16px; line-height: 1.5; color: var(--muted); }
    .instruction { font-size: 15px; color: var(--text); margin-bottom: 24px; }

    /* Buttons */
    .btn {
      appearance: none; border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent), var(--card-solid);
      color: var(--text); border-radius: var(--radius-sm); padding: 16px;
      font-size: 16px; font-weight: 650; cursor: pointer; width: 100%;
      transition: transform 0.12s ease, box-shadow 0.2s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 4px 12px rgba(0,0,0,0.15);
    }
    .btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn.primary {
      background: linear-gradient(180deg, rgba(255,255,255,0.22), transparent 55%), linear-gradient(145deg, var(--accent), #1a7a75);
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      color: #04201f; box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 6px 18px rgba(45, 212, 191, 0.3);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none; }

    /* Progress Bar */
    .progress-wrap { width: 100%; height: 4px; background: var(--card-solid); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }

    /* Quatrain Text */
    .quatrain-text {
      font-size: clamp(18px, 4.5vw, 22px); line-height: 1.6; text-align: center;
      margin-bottom: 32px; white-space: pre-line; color: var(--text);
    }

    /* SAN Questions */
    .san-group { margin-bottom: 24px; }
    .san-label { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text); }
    .san-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .san-btn {
      padding: 12px 8px; font-size: 13px; font-weight: 600;
      background: var(--card-solid); border: 1px solid var(--line);
      color: var(--muted); border-radius: 10px; cursor: pointer;
      transition: all 0.2s ease; text-align: center;
    }
    .san-btn:hover { border-color: var(--line-strong); }
    .san-btn.selected {
      border-color: var(--accent); background: rgba(45, 212, 191, 0.15);
      color: var(--accent); box-shadow: 0 0 12px rgba(45, 212, 191, 0.1);
    }
    .san-btn.selected.neg {
      border-color: var(--warm); background: rgba(251, 191, 122, 0.15);
      color: var(--warm); box-shadow: 0 0 12px rgba(251, 191, 122, 0.1);
    }

    /* Loader */
    .loader {
      width: 40px; height: 40px; border: 3px solid var(--line);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: var(--danger); text-align: center; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- ЭКРАН 0: Видео -->
  <div id="screen-video" class="screen active">
    <video id="introVideo" autoplay muted playsinline>
      <source src="intro.mp4" type="video/mp4">
    </video>
  </div>

  <!-- ЭКРАН 1: Интро -->
  <div id="screen-intro" class="screen">
    <div class="card">
      <h1>VitaNeuro T2</h1>
      <p class="instruction">
        Оценивается не то, о чём текст, а то, что он сделал с вами.<br><br>
        • Прочитайте текст два раза.<br>
        • Отметьте своё состояние.<br>
        • Не возвращайтесь назад.
      </p>
      <button id="startBtn" class="btn primary">Начать тест</button>
      <div id="introLoader" class="loader" style="display:none;"></div>
      <div id="introError" class="error-msg"></div>
    </div>
  </div>

  <!-- ЭКРАН 2: Тест -->
  <div id="screen-test" class="screen">
    <div class="card">
      <div class="progress-wrap"><div id="progressFill" class="progress-fill" style="width: 0%"></div></div>
      <div id="progressText" style="text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 16px;"></div>
      
      <div id="quatrainText" class="quatrain-text"></div>
      
      <div class="san-group">
        <div class="san-label">Самочувствие</div>
        <div class="san-options" data-axis="s">
          <button class="san-btn" data-val="-1">Тяжесть</button>
          <button class="san-btn" data-val="0">Нейтрально</button>
          <button class="san-btn" data-val="1">Лёгкость</button>
        </div>
      </div>
      
      <div class="san-group">
        <div class="san-label">Энергия</div>
        <div class="san-options" data-axis="a">
          <button class="san-btn" data-val="-1">Спад</button>
          <button class="san-btn" data-val="0">Ровно</button>
          <button class="san-btn" data-val="1">Подъём</button>
        </div>
      </div>
      
      <div class="san-group">
        <div class="san-label">Настроение</div>
        <div class="san-options" data-axis="n">
          <button class="san-btn neg" data-val="-1">Негатив</button>
          <button class="san-btn" data-val="0">Ровно</button>
          <button class="san-btn" data-val="1">Позитив</button>
        </div>
      </div>

      <button id="nextBtn" class="btn primary" disabled>Далее</button>
      <div id="testLoader" class="loader" style="display:none;"></div>
      <div id="testError" class="error-msg"></div>
    </div>
  </div>

  <!-- ЭКРАН 3: Завершение -->
  <div id="screen-end" class="screen">
    <div class="card" style="text-align: center;">
      <h1 style="color: var(--accent);">Готово</h1>
      <p class="instruction">Спасибо, тестирование окончено, данные сохранены.</p>
    </div>
  </div>

  <script>
    // === КОНФИГУРАЦИЯ ===
    const GITHUB_TOKEN = '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'; // ВСТАВЬ СЮДА СВОЙ ТОКЕН
    const OWNER = 'Stounker';
    const REPO = 'repo';
    const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

    // === СОСТОЯНИЕ ===
    let currentRespondent = 1;
    let quatrainIds = [];
    let quatrainPool = [];
    let currentIndex = 0;
    let currentSan = { s: null, a: null, n: null };

    // === УТИЛИТЫ ===
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function getFile(path) {
      const resp = await fetch(`${API_BASE}/${path}`, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (resp.status === 404) return null;
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return { content: JSON.parse(atob(data.content)), sha: data.sha };
    }

    async function putFile(path, content, sha, message, retries = 3) {
      const body = { message, content: btoa(JSON.stringify(content, null, 2)) };
      if (sha) body.sha = sha;
      
      const resp = await fetch(`${API_BASE}/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (resp.status === 409 && retries > 0) {
        // Race condition: повторяем чтение и запись
        const fresh = await getFile(path);
        if (fresh) {
          // Обновляем контент новыми данными (предполагаем, что мы добавляем в массив)
          if (path === 'ratings.json' && content.ratings) {
             // В данном простом случае мы передаем уже обновленный content, 
             // но если был конфликт, нам нужно перечитать и добавить наш элемент заново.
             // Для упрощения: вызывающая сторона должна обработать это, или мы делаем это здесь:
          }
          return putFile(path, content, fresh.sha, message, retries - 1);
        }
      }
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`PUT failed: ${resp.status} ${err}`);
      }
      return resp.json();
    }

    // === ЛОГИКА ===
    document.getElementById('introVideo').addEventListener('ended', () => {
      setTimeout(() => showScreen('screen-intro'), 500);
    });

    document.getElementById('startBtn').addEventListener('click', async () => {
      const btn = document.getElementById('startBtn');
      const loader = document.getElementById('introLoader');
      const err = document.getElementById('introError');
      
      btn.disabled = true;
      loader.style.display = 'block';
      err.textContent = '';

      try {
        // 1. Читаем или создаем ratings.json
        let ratingsData = await getFile('ratings.json');
        if (!ratingsData) {
          await putFile('ratings.json', { ratings: [] }, null, 'Init ratings.json');
          ratingsData = { content: { ratings: [] }, sha: null };
        }

        // 2. Считаем уникальных респондентов
        const uniqueRespondents = new Set(ratingsData.content.ratings.map(r => r.respondent));
        if (uniqueRespondents.size >= 50) {
          showScreen('screen-end');
          return;
        }

        currentRespondent = uniqueRespondents.size > 0 ? Math.max(...uniqueRespondents) + 1 : 1;

        // 3. Загружаем схему и пул
        const respData = await getFile('respondent_data.json');
        const poolData = await getFile('f_f_1_210.json');
        
        if (!respData || !poolData) throw new Error('Не найдены respondent_data.json или f_f_1_210.json');

        const key = `respondent_${currentRespondent}`;
        quatrainIds = respData.content[key];
        if (!quatrainIds) throw new Error(`Нет данных для респондента ${currentRespondent}`);

        quatrainPool = poolData.content;

        // 4. Запускаем тест
        currentIndex = 0;
        showScreen('screen-test');
        renderQuatrain();

      } catch (e) {
        console.error(e);
        err.textContent = 'Ошибка загрузки: ' + e.message;
        btn.disabled = false;
        loader.style.display = 'none';
      }
    });

    function renderQuatrain() {
      currentSan = { s: null, a: null, n: null };
      document.getElementById('nextBtn').disabled = true;
      document.querySelectorAll('.san-btn').forEach(b => b.classList.remove('selected', 'neg'));
      document.getElementById('testError').textContent = '';

      const qId = quatrainIds[currentIndex];
      // Ищем катрен, учитывая возможные пробелы в ID из JSON
      const q = quatrainPool.find(item => String(item.id).trim() === String(qId).trim());
      
      if (!q) {
        document.getElementById('quatrainText').textContent = `Ошибка: катрен ${qId} не найден`;
        return;
      }

      document.getElementById('quatrainText').textContent = q.text;
      document.getElementById('progressText').textContent = `Катрен ${currentIndex + 1} из ${quatrainIds.length}`;
      document.getElementById('progressFill').style.width = `${((currentIndex) / quatrainIds.length) * 100}%`;
    }

    // Обработка кликов по SAN
    document.querySelectorAll('.san-options').forEach(group => {
      const axis = group.dataset.axis;
      group.querySelectorAll('.san-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          group.querySelectorAll('.san-btn').forEach(b => b.classList.remove('selected', 'neg'));
          btn.classList.add('selected');
          if (btn.dataset.val === "-1") btn.classList.add('neg');
          
          currentSan[axis] = parseInt(btn.dataset.val, 10);
          
          // Проверка готовности
          if (currentSan.s !== null && currentSan.a !== null && currentSan.n !== null) {
            document.getElementById('nextBtn').disabled = false;
          }
        });
      });
    });

    document.getElementById('nextBtn').addEventListener('click', async () => {
      const btn = document.getElementById('nextBtn');
      const loader = document.getElementById('testLoader');
      const err = document.getElementById('testError');
      
      btn.disabled = true;
      loader.style.display = 'block';
      err.textContent = '';

      try {
        const qId = quatrainIds[currentIndex];
        
        // Читаем актуальный ratings.json для защиты от конфликтов
        const ratingsData = await getFile('ratings.json');
        if (!ratingsData) throw new Error('ratings.json исчез');

        // Добавляем запись
        ratingsData.content.ratings.push({
          respondent: currentRespondent,
          quatrain: qId,
          s: currentSan.s,
          a: currentSan.a,
          n: currentSan.n,
          ts: new Date().toISOString()
        });

        // Пишем обратно
        await putFile('ratings.json', ratingsData.content, ratingsData.sha, `Add rating resp ${currentRespondent} q ${qId}`);

        currentIndex++;
        if (currentIndex < quatrainIds.length) {
          renderQuatrain();
        } else {
          document.getElementById('progressFill').style.width = '100%';
          setTimeout(() => showScreen('screen-end'), 300);
        }
      } catch (e) {
        console.error(e);
        err.textContent = 'Ошибка сохранения: ' + e.message + '. Попробуйте еще раз.';
        btn.disabled = false;
      } finally {
        loader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
